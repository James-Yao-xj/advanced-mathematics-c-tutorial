name: Deploy course homepage
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation tools
        run: pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      # Keep the original PDFs as the only source of published handouts.
      - name: Build documentation site
        run: |
          mkdir -p docs/handouts
          cp handouts/*.pdf docs/handouts/
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
